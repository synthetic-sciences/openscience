version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "github_actions"
    groups:
      actions:
        patterns:
          - "*"

  # Bun lockfiles. The security `overrides` in package.json are otherwise
  # maintained by hand. Majors are ignored until each group has a green
  # track record; bump them deliberately. Needs the text-format bun.lock
  # (present); if the first run reports an unsupported ecosystem, check the
  # org's Dependabot settings.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      ai-sdk:
        patterns:
          - "ai"
          - "@ai-sdk/*"
          - "@openrouter/*"
      solid:
        patterns:
          - "solid-js"
          - "solid-*"
          - "@solidjs/*"
          - "@solid-primitives/*"
          - "@kobalte/*"
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
      dev-tools:
        patterns:
          - "typescript"
          - "@typescript/*"
          - "@types/*"
          - "prettier"
          - "turbo"
          - "husky"
          - "@playwright/*"

  - package-ecosystem: "bun"
    directory: "/frontend/landing"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      landing:
        patterns:
          - "*"
