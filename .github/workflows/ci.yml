name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run typecheck

  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun run format:check

  # The data-directory import runs at boot on every user's machine and moves
  # their credentials and history between two roots. It is also the one piece
  # of the CLI built almost entirely out of filesystem primitives that differ
  # per platform — hardlinks, exclusive create, chmod, path separators — so
  # the Linux-only `test` job below is not evidence it works. This leg is
  # deliberately narrow: one suite, three operating systems, no sandbox or web
  # assets to build.
  migration:
    name: Migration (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun test test/global/data-dir.test.ts
        shell: bash
        working-directory: backend/cli

  # Windows Job Objects are the runtime ownership boundary for terminals,
  # commands, compute, kernels, LSPs, and local MCP servers. The source-level
  # structure contracts run everywhere; this leg exercises the real Kernel32
  # handles, descendant inheritance, named-job reopen, and verified teardown.
  windows-runtime:
    name: Windows runtime ownership
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: bun test test/process/windows-job.test.ts test/global/data-root.test.ts
        shell: bash
        working-directory: backend/cli

  # File writes, no-replace rename, and recoverable trash use native Windows
  # handles to pin verified directories and reject reparse/swap races. Run the
  # real implementation on NTFS; Linux source tests cannot exercise Win32
  # sharing modes or SetFileInformationByHandle.
  windows-files:
    name: Windows safe file mutations
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Configure git for file-route tests
        run: |
          git config --global user.email "ci@openscience.dev"
          git config --global user.name "OpenScience CI"
          git config --global init.defaultBranch main
        shell: bash
      # Keep the native Windows slice on the repository's 15-second test
      # contract. Calling `bun test` directly otherwise restores Bun's 5-second
      # default, which is too short for NTFS operations on a loaded hosted runner.
      - run: bun test --timeout 15000 test/file/safe-io.test.ts test/file/rename.test.ts test/file/trash.test.ts
        shell: bash
        working-directory: backend/cli

  # macOS responsibility IDs are the kernel-backed ownership boundary for
  # processes that setsid/double-fork away from their original PID and process
  # group. Exercise the native private ABI and both durable ledgers on an
  # actual macOS runner; source-contract tests on Linux cannot prove teardown.
  macos-runtime:
    name: macOS runtime ownership
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - run: >-
          bun test
          test/process/darwin-responsibility.test.ts
          test/credentials/process-ledger.test.ts
          test/project/authority-process-ledger.test.ts
        shell: bash
        working-directory: backend/cli

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Configure git for tests
        run: |
          git config --global user.email "ci@openscience.dev"
          git config --global user.name "OpenScience CI"
          git config --global init.defaultBranch main
      - name: Install and verify Linux sandbox and SSH fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap openssh-server
          # Ubuntu 24.04's host-wide AppArmor policy blocks unprivileged user
          # namespaces on the hosted runner before bubblewrap can apply our
          # stricter per-process profile. This runner is disposable; enable
          # user namespaces for the job, then prove the sandbox can start.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent -- true
          sudo install -d -m 0755 /run/sshd
          test -x /usr/sbin/sshd
      - name: Exercise real OpenSSH dispatch and recovery
        run: bun test test/compute/ssh-integration.test.ts
        working-directory: backend/cli
      - name: Build embedded web assets for server tests
        run: |
          bun run --cwd frontend/workspace build
          bun run --cwd backend/cli script/generate-web-assets.ts
      - run: bun run --cwd backend/cli test

  build:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Build workspace UI
        run: bun run --cwd frontend/workspace build
      - name: Build docs site
        run: bun run --cwd frontend/docs build

  # frontend/landing is standalone (own lockfile, not a workspace member),
  # so the root typecheck/build jobs never touch it.
  landing:
    name: Build (landing)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Install
        working-directory: frontend/landing
        run: bun install --frozen-lockfile
      - name: Typecheck
        working-directory: frontend/landing
        run: bunx tsc -b
      - name: Test
        working-directory: frontend/landing
        run: bun test src/pages/Landing.test.ts
      - name: Build
        working-directory: frontend/landing
        run: bun run build

  # Packages with no typecheck task and scripts that otherwise only ever
  # execute during a release — catch syntax errors before release day.
  smoke:
    name: Smoke (launcher + scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Launcher parses
        run: node --check tooling/launcher/bin/synsci.mjs
      - name: npm bin wrapper parses
        run: node --check backend/cli/bin/openscience
      - name: Install script parses
        run: bash -n install && bash -n frontend/landing/public/install
      - name: Install script copies are in sync
        run: diff -q install frontend/landing/public/install
      - name: Release scripts parse
        # transpile-only: bundling would follow imports into third-party
        # packages with exports quirks (giget via node-fetch-native)
        run: |
          for f in tooling/repo/*.ts; do
            bun -e "new Bun.Transpiler({ loader: 'ts' }).transformSync(await Bun.file('$f').text())"
            echo "OK $f"
          done

  actionlint:
    name: Lint workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
