name: Fast CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: fast-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Keep the merge loop intentionally small. Platform ownership tests, the full
# backend suite, formatting, docs, landing, and browser E2E run outside the PR
# critical path in Deep CI / E2E. This lane proves the monorepo still types,
# the user-facing workspace bundles, and release entrypoints still parse.
jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Typecheck monorepo
        run: bun run typecheck

  build:
    name: Build (web)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-bun
      - name: Build workspace
        run: bun run --cwd frontend/workspace build

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Smoke release entrypoints
        shell: bash
        run: |
          node --check tooling/launcher/bin/synsci.mjs
          node --check backend/cli/bin/openscience
          bash -n install
          bash -n frontend/landing/public/install
          diff -q install frontend/landing/public/install
