name: prod publish
run-name: "prod publish ${{ inputs.version || inputs.bump }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: true
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Exact stable version to publish or resume (overrides bump, for example 2.0.32)"
        required: false
        type: string

# One release at a time. Keying the group on the inputs let a `patch` and a
# `minor` dispatch run concurrently and race on tags and the GitHub release.
concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the protected default branch
        shell: bash
        env:
          EXACT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY,,}" != "synthetic-sciences/openscience" ]]; then
            echo "::error::Production releases must run in synthetic-sciences/OpenScience; received $GITHUB_REPOSITORY."
            exit 1
          fi
          if [[ -n "$EXACT_VERSION" && ! "$EXACT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Exact production version must be stable semver such as 2.0.32; received '$EXACT_VERSION'."
            exit 1
          fi
          if [[ "$GITHUB_REF" != "refs/heads/main" && ( -z "$EXACT_VERSION" || "$GITHUB_REF" != "refs/tags/v$EXACT_VERSION" ) ]]; then
            echo "::error::Production releases must start on main; an exact-version resume may run only from its immutable refs/tags/v<version> tag. Received $GITHUB_REF."
            exit 1
          fi

  npm-preflight:
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Authenticate and prove ownership of every package before creating a
      # draft release or making the first immutable npm registry write.
      - name: Preflight npm publisher identity and ownership
        run: ./tooling/repo/npm-release.ts preflight
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  version:
    needs:
      - release-source
      - npm-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # version.ts creates the draft GitHub release before build/publish.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - id: version
        run: ./tooling/repo/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSCIENCE_BUMP: ${{ inputs.bump }}
          OPENSCIENCE_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      source: ${{ steps.version.outputs.source }}
      artifact_source: ${{ steps.version.outputs.artifact_source }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # The job verifies/uploads native archives and checksums to the draft release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source }}

      - uses: ./.github/actions/setup-bun

      - name: Restore immutable CLI build
        id: cli-build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ needs.version.outputs.version }}

      - name: Build
        if: steps.cli-build-cache.outputs.cache-hit != 'true'
        run: ./backend/cli/script/build.ts
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE: ${{ needs.version.outputs.release }}
          GH_TOKEN: ${{ github.token }}

      - name: Cache immutable CLI build
        if: steps.cli-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ needs.version.outputs.version }}

      # Persist the nondeterministic binary build before the first draft-asset
      # mutation. A retry can then verify/upload these exact bytes.
      - name: Verify or upload immutable draft assets
        run: ./tooling/repo/release-assets.ts backend/cli/dist
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE: ${{ needs.version.outputs.release }}
          GH_TOKEN: ${{ github.token }}

    outputs:
      version: ${{ needs.version.outputs.version }}

  verify-native-cli:
    needs:
      - version
      - build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: openscience-linux-x64
            other: openscience-linux-arm64
          - runner: ubuntu-24.04-arm
            target: openscience-linux-arm64
            other: openscience-linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Restore CLI build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true

      - name: Install the native npm distribution
        env:
          TARGET_PACKAGE: "@synsci/${{ matrix.target }}"
          OTHER_PACKAGE: "@synsci/${{ matrix.other }}"
        run: |
          pack_dir="$RUNNER_TEMP/openscience-native-pack"
          prefix="$RUNNER_TEMP/openscience-native-prefix"
          export HOME="$RUNNER_TEMP/openscience-native-home"
          mkdir -p "$HOME"

          bun backend/cli/script/pack-native-smoke.ts "$pack_dir"
          npm install --global --prefix "$prefix" "$pack_dir/wrapper.tgz"

          wrapper_dir="$prefix/lib/node_modules/@synsci/openscience"
          npm ls --global --prefix "$prefix" @synsci/openscience --all
          WRAPPER_DIR="$wrapper_dir" node -e 'require.resolve(process.env.TARGET_PACKAGE + "/package.json", { paths: [process.env.WRAPPER_DIR] })'
          if WRAPPER_DIR="$wrapper_dir" node -e 'require.resolve(process.env.OTHER_PACKAGE + "/package.json", { paths: [process.env.WRAPPER_DIR] })' 2>/dev/null; then
            echo "::error::npm installed the non-native optional package $OTHER_PACKAGE"
            exit 1
          fi
          if WRAPPER_DIR="$wrapper_dir" node -e 'require.resolve("@synsci/atlas/package.json", { paths: [process.env.WRAPPER_DIR] })' 2>/dev/null; then
            echo "::error::@synsci/openscience still installs the discontinued @synsci/atlas companion"
            exit 1
          fi
          "$prefix/bin/openscience" --version

  prepare-npm:
    needs:
      - version
      - build-cli
      - verify-native-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Restore immutable CLI build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true

      - name: Restore immutable npm artifacts
        id: npm-artifacts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm/${{ needs.version.outputs.version }}
          key: npm-release-${{ needs.version.outputs.version }}

      - name: Pack the complete npm release set
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        run: ./tooling/repo/prepare-npm.ts
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.artifact_source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm/${{ needs.version.outputs.version }}

      - name: Verify packed SDK and plugin exports before publication
        run: ./tooling/repo/verify-npm-artifacts.ts
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.artifact_source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm/${{ needs.version.outputs.version }}

      - name: Cache immutable npm artifacts
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm/${{ needs.version.outputs.version }}
          key: npm-release-${{ needs.version.outputs.version }}

  publish:
    needs:
      - version
      - prepare-npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      # publish.ts falls back to a release PR when branch protection rejects
      # the automated version-bump commit on main.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source }}

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup git committer
        run: |
          git config user.email "openscience@syntheticsciences.dev"
          git config user.name "openscience"

      - name: Restore immutable npm artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm/${{ needs.version.outputs.version }}
          key: npm-release-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true

      - name: Restore immutable CLI build for downstream registries
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true

      - name: Publish
        run: ./tooling/repo/publish.ts
        env:
          HUSKY: "0"
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE: ${{ needs.version.outputs.release }}
          OPENSCIENCE_RELEASE_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.artifact_source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm/${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ github.token }}
          # Fine-grained PAT with push access to synthetic-sciences/homebrew-tap;
          # github.token is repo-scoped and can't update the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
          # The release must not go public while `npx synsci` still serves an
          # older launcher that advertises the retired Atlas surface.
          OPENSCIENCE_REQUIRE_LAUNCHER_PUBLISH: "true"

  # Record the npm release as a GitHub deployment so it shows up in the
  # repo's Deployments sidebar next to the Vercel Production/Preview entries.
  deployment:
    needs:
      - version
      - publish
    # Previews (no release output) shouldn't create a production deployment.
    if: needs.version.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        with:
          script: |
            const version = process.env.VERSION
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo,
              // The tag points at the release commit (the tree that was
              // actually published); context.sha is the pre-release commit.
              ref: process.env.TAG || context.sha,
              environment: "npm",
              auto_merge: false,
              required_contexts: [],
              description: `@synsci/openscience ${version}`,
              production_environment: true,
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: `https://www.npmjs.com/package/@synsci/openscience/v/${version}`,
              description: `Published @synsci/openscience@${version}`,
            })
