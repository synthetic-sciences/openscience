name: prod publish
run-name: "${{ inputs.version && format('prod publish {0}', inputs.version) || format('prod publish {0}', inputs.bump) }}"

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

# One release at a time. Keying the group on the inputs let a `patch` and a
# `minor` dispatch run concurrently and race on tags and the GitHub release.
concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  release-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the protected default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY,,}" != "synthetic-sciences/openscience" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Production releases must be dispatched from synthetic-sciences/OpenScience main; received $GITHUB_REPOSITORY at $GITHUB_REF."
            exit 1
          fi

  version:
    needs: release-source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      # version.ts creates the draft GitHub release before build/publish.
      contents: write
    steps:
      - name: Require a bump or version input
        if: ${{ !inputs.bump && !inputs.version }}
        run: |
          echo "::error::Provide 'bump' or 'version'. An empty dispatch would publish a 0.0.0-main preview to npm as if it were a release."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - id: version
        run: ./tooling/repo/version.ts
        env:
          GH_TOKEN: ${{ github.token }}
          OPENSCIENCE_BUMP: ${{ inputs.bump }}
          OPENSCIENCE_VERSION: ${{ inputs.version }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      # build.ts uploads the native archives and checksums to the draft release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        run: ./backend/cli/script/build.ts
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE: ${{ needs.version.outputs.release }}
          GH_TOKEN: ${{ github.token }}

      - name: Cache CLI build
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ github.run_id }}

    outputs:
      version: ${{ needs.version.outputs.version }}

  verify-native-cli:
    needs:
      - version
      - build-cli
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: openscience-linux-x64
            other: openscience-linux-arm64
          - runner: ubuntu-24.04-arm
            target: openscience-linux-arm64
            other: openscience-linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Restore CLI build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Install the native npm distribution
        env:
          TARGET_PACKAGE: "@synsci/${{ matrix.target }}"
          OTHER_PACKAGE: "@synsci/${{ matrix.other }}"
        run: |
          pack_dir="$RUNNER_TEMP/openscience-native-pack"
          prefix="$RUNNER_TEMP/openscience-native-prefix"
          export HOME="$RUNNER_TEMP/openscience-native-home"
          mkdir -p "$HOME"

          bun backend/cli/script/pack-native-smoke.ts "$pack_dir"
          npm install --global --prefix "$prefix" "$pack_dir/wrapper.tgz"

          wrapper_dir="$prefix/lib/node_modules/@synsci/openscience"
          npm ls --global --prefix "$prefix" @synsci/openscience --all
          WRAPPER_DIR="$wrapper_dir" node -e 'require.resolve(process.env.TARGET_PACKAGE + "/package.json", { paths: [process.env.WRAPPER_DIR] })'
          if WRAPPER_DIR="$wrapper_dir" node -e 'require.resolve(process.env.OTHER_PACKAGE + "/package.json", { paths: [process.env.WRAPPER_DIR] })' 2>/dev/null; then
            echo "::error::npm installed the non-native optional package $OTHER_PACKAGE"
            exit 1
          fi
          "$prefix/bin/openscience" --version

  publish:
    needs:
      - version
      - build-cli
      - verify-native-cli
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: write
      # publish.ts falls back to a release PR when branch protection rejects
      # the automated version-bump commit on main.
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup git committer
        run: |
          git config user.email "openscience@syntheticsciences.dev"
          git config user.name "openscience"

      - name: Restore CLI build
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: cli-build-${{ github.run_id }}
          fail-on-cache-miss: true

      - name: Publish
        run: ./tooling/repo/publish.ts
        env:
          HUSKY: "0"
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE: ${{ needs.version.outputs.release }}
          GITHUB_TOKEN: ${{ github.token }}
          # Fine-grained PAT with push access to synthetic-sciences/homebrew-tap;
          # github.token is repo-scoped and can't update the tap.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  # Record the npm release as a GitHub deployment so it shows up in the
  # repo's Deployments sidebar next to the Vercel Production/Preview entries.
  deployment:
    needs:
      - version
      - publish
    # Previews (no release output) shouldn't create a production deployment.
    if: needs.version.outputs.release != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      deployments: write
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
        with:
          script: |
            const version = process.env.VERSION
            const deployment = await github.rest.repos.createDeployment({
              ...context.repo,
              // The tag points at the release commit (the tree that was
              // actually published); context.sha is the pre-release commit.
              ref: process.env.TAG || context.sha,
              environment: "npm",
              auto_merge: false,
              required_contexts: [],
              description: `@synsci/openscience ${version}`,
              production_environment: true,
            })
            await github.rest.repos.createDeploymentStatus({
              ...context.repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: `https://www.npmjs.com/package/@synsci/openscience/v/${version}`,
              description: `Published @synsci/openscience@${version}`,
            })
