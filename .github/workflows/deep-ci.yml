name: Windows storage diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        mode: [base, feature, feature-gc, feature-strict]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.mode == 'base' && 'a08e0ad0ad3d6448123039ee4659163eb2e35d99' || 'b6648c7882ac229eacf41011752321a23fd5dc31' }}
      - uses: ./.github/actions/setup-bun
      - name: Instrument the existing rescan cleanup
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: |
          python - <<'PYPROBE'
          import os,re
          from pathlib import Path
          mode=os.environ['PROBE_MODE']
          p=Path('backend/cli/test/global/data-dir.test.ts')
          s=p.read_text()
          cleanup="""afterEach(async () => {
            for (const root of roots.splice(0)) {
              if (process.env.PROBE_MODE === "feature-gc") Bun.gc(true)
              try {
                await fs.rm(root, { recursive: true, force: true })
                console.error("[windows-probe] first cleanup succeeded", process.env.PROBE_MODE)
              } catch (error) {
                console.error("[windows-probe] cleanup error", error)
                console.error("[windows-probe] remaining entries", await fs.readdir(root, { recursive: true }).catch(() => []))
                Bun.gc(true)
                await fs.rm(root, { recursive: true, force: true }).then(
                  () => console.error("[windows-probe] cleanup after GC succeeded"),
                  (failure) => console.error("[windows-probe] cleanup after GC failed", failure),
                )
                throw error
              }
            }
          })"""
          s,count=re.subn(r'afterEach\(async \(\) => \{.*?\n\}\)',lambda _:cleanup,s,count=1,flags=re.S)
          assert count==1
          p.write_text(s)
          if mode=='feature-strict':
            p=Path('backend/cli/src/storage/database.ts');s=p.read_text();assert 'db.close()' in s;p.write_text(s.replace('db.close()','db.close(true)'))
          PYPROBE
      - name: Run the exact rescan case
        working-directory: backend/cli
        shell: bash
        env:
          PROBE_MODE: ${{ matrix.mode }}
        run: bun test --timeout 15000 ./test/global/data-dir.test.ts -t 'legacy-root rescans'
