name: Windows Git Bash diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-bun
        with:
          install: "false"
      - name: Inspect Git Bash environment
        shell: bash
        run: |
          bun -e 'console.log(JSON.stringify({git:Bun.which("git"), gitexe:Bun.which("git.exe"), bash:Bun.which("bash"), shell:process.env.SHELL, exec:process.env.GIT_EXEC_PATH}));'
