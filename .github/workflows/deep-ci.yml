name: Windows Git Bash diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/setup-bun
      - name: Inspect native shell discovery
        shell: pwsh
        working-directory: backend/cli
        run: |
          bun -e 'console.log(JSON.stringify({git:Bun.which("git"), gitexe:Bun.which("git.exe"), bash:Bun.which("bash"), pf:process.env.ProgramFiles, shell:process.env.SHELL})); const {Shell}=await import("./src/shell/shell.ts"); console.log(Shell.posix())'
