name: test publish
run-name: "test publish ${{ inputs.version || github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override test version, e.g. 1.3.5-test.1"
        required: false
        type: string
      run_packaged_e2e:
        description: "Install the exact candidate version and run packaged browser e2e"
        required: false
        type: boolean
        default: true
      run_os_smoke:
        description: "Install the exact candidate on Linux, macOS, Windows, and musl"
        required: false
        type: boolean
        default: true

concurrency: npm-test-publish

permissions:
  contents: read
  id-token: write

jobs:
  test-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the protected default branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REPOSITORY,,}" != "synthetic-sciences/openscience" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::npm test publishing uses registry credentials and must be dispatched from synthetic-sciences/OpenScience main; received $GITHUB_REPOSITORY at $GITHUB_REF."
            exit 1
          fi

  version:
    needs: test-source
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      source: ${{ steps.version.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          source="$(git rev-parse HEAD)"
          if [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            # Match the production release script: workspace package versions
            # intentionally stay static between releases, so the public stable
            # tag is the only authoritative base for the next candidate.
            current="$(npm view @synsci/openscience@latest version)"
            if ! [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not resolve the current stable OpenScience version; received '$current'"
              exit 1
            fi
            core="${current%%-*}"
            IFS=. read -r major minor patch <<< "$core"
            version="${major}.${minor}.$((patch + 1))-test.${GITHUB_RUN_ID}"
          fi

          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-test\.[0-9A-Za-z.-]+$ ]]; then
            echo "::error::Test publish versions must look like 1.3.5-test.1, received '$version'"
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "Preparing immutable npm test version $version from $source"

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.source }}
      - uses: ./.github/actions/setup-bun
      - name: Look up immutable npm test artifacts
        id: npm-artifacts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm-test/${{ needs.version.outputs.version }}
          key: npm-test-artifacts-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}
          lookup-only: true
      - name: Restore immutable CLI build
        id: cli-build-cache
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: npm-test-cli-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}
      - name: Build all npm CLI packages
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true' && steps.cli-build-cache.outputs.cache-hit != 'true'
        run: ./backend/cli/script/build.ts
        env:
          OPENSCIENCE_CHANNEL: test
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
      - name: Cache immutable CLI build
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true' && steps.cli-build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: npm-test-cli-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}

  prepare-npm:
    needs:
      - version
      - build-cli
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source }}
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Restore immutable npm test artifacts
        id: npm-artifacts-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm-test/${{ needs.version.outputs.version }}
          key: npm-test-artifacts-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}
      - name: Restore immutable CLI build
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            backend/cli/dist
            frontend/workspace/dist/version.json
          key: npm-test-cli-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true
      - name: Fail closed if an uncached version is occupied
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        run: ./tooling/repo/npm-test-release.ts assert-empty
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.source }}
      - name: Pack the complete 15-package candidate once
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        run: ./tooling/repo/prepare-npm.ts
        env:
          HUSKY: "0"
          OPENSCIENCE_CHANNEL: test
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm-test/${{ needs.version.outputs.version }}
      - name: Verify immutable manifest and packed module exports
        run: ./tooling/repo/verify-npm-artifacts.ts
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm-test/${{ needs.version.outputs.version }}
      - name: Cache immutable source, version, integrity, and tarballs
        if: steps.npm-artifacts-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm-test/${{ needs.version.outputs.version }}
          key: npm-test-artifacts-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}

  publish-test:
    needs:
      - version
      - prepare-npm
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ needs.version.outputs.version }}
      source: ${{ needs.version.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source }}
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Restore immutable npm test artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm-test/${{ needs.version.outputs.version }}
          key: npm-test-artifacts-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true
      - name: Stage and verify the complete npm candidate
        run: ./tooling/repo/npm-test-release.ts stage
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm-test/${{ needs.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"

  packaged-e2e:
    needs: publish-test
    if: inputs.run_packaged_e2e
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.publish-test.outputs.source }}
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Set Playwright browser path
        run: echo "PLAYWRIGHT_BROWSERS_PATH=$RUNNER_TEMP/ms-playwright" >> "$GITHUB_ENV"
      - name: Install Playwright browsers
        working-directory: frontend/workspace
        run: bunx playwright install --with-deps
      - name: Install and verify Linux sandbox
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap
          # Ubuntu 24.04's host-wide AppArmor policy blocks unprivileged user
          # namespaces on the hosted runner before bubblewrap can apply our
          # stricter per-process profile. This runner is disposable; enable
          # user namespaces for the job, then prove the sandbox can start.
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            echo 0 | sudo tee /proc/sys/kernel/apparmor_restrict_unprivileged_userns
          fi
          bwrap --ro-bind / / --dev /dev --proc /proc --unshare-pid --die-with-parent -- true
      - name: Install published OpenScience test package
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/openscience-npm-test-prefix"
          home="$RUNNER_TEMP/openscience-npm-test-home"
          mkdir -p "$prefix" "$home"
          npm install --global --prefix "$prefix" "@synsci/openscience@${{ needs.publish-test.outputs.version }}"
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/openscience" --version | tee "$RUNNER_TEMP/openscience-version.txt"
          grep -Fx "${{ needs.publish-test.outputs.version }}" "$RUNNER_TEMP/openscience-version.txt"
          wrapper_dir="$prefix/lib/node_modules/@synsci/openscience"
          if WRAPPER_DIR="$wrapper_dir" node -e 'require.resolve("@synsci/atlas/package.json", { paths: [process.env.WRAPPER_DIR] })' 2>/dev/null; then
            echo "::error::@synsci/openscience still installs the discontinued @synsci/atlas companion"
            exit 1
          fi

          launcher_prefix="$RUNNER_TEMP/synsci-npm-test-prefix"
          npm install --global --prefix "$launcher_prefix" "synsci@${{ needs.publish-test.outputs.version }}"
          node --check "$launcher_prefix/lib/node_modules/synsci/bin/synsci.mjs"
          LAUNCHER_DIR="$launcher_prefix/lib/node_modules/synsci" node --input-type=module - <<'NODE'
          const mod = await import(`file://${process.env.LAUNCHER_DIR}/lib/channel.mjs`)
          const spec = mod.opensciencePackageSpec(process.env.OPENSCIENCE_VERSION)
          if (spec !== "@synsci/openscience@test") throw new Error(`synsci@test resolves ${spec}`)
          console.log(`synsci@test resolves ${spec}`)
          NODE

          sdk_probe="$RUNNER_TEMP/openscience-sdk-probe"
          mkdir -p "$sdk_probe"
          npm install --prefix "$sdk_probe" \
            "@synsci/sdk@${{ needs.publish-test.outputs.version }}" \
            "@synsci/plugin@${{ needs.publish-test.outputs.version }}"
          cat > "$sdk_probe/probe.mjs" <<'NODE'
          await import("@synsci/sdk")
          await import("@synsci/sdk/client")
          await import("@synsci/sdk/server")
          await import("@synsci/sdk/v2")
          await import("@synsci/sdk/v2/client")
          await import("@synsci/sdk/v2/server")
          await import("@synsci/plugin")
          await import("@synsci/plugin/tool")
          console.log("published SDK and plugin exports resolve")
          NODE
          node "$sdk_probe/probe.mjs"
        env:
          HOME: ${{ runner.temp }}/openscience-npm-test-home
          OPENSCIENCE_VERSION: ${{ needs.publish-test.outputs.version }}
      - name: Set isolated OpenScience paths
        run: |
          PASS="ci-$(openssl rand -hex 16)"
          {
            echo "OPENSCIENCE_SERVER_PASSWORD=$PASS"
            echo "VITE_OPENSCIENCE_SERVER_PASSWORD=$PASS"
            echo "OPENSCIENCE_E2E_ROOT=$RUNNER_TEMP/openscience-e2e"
            echo "OPENSCIENCE_TEST_HOME=$RUNNER_TEMP/openscience-e2e/home"
            echo "OPENSCIENCE_CONFIG_DIR=$RUNNER_TEMP/openscience-e2e/config/openscience"
            echo "OPENSCIENCE_DATA_DIR=$RUNNER_TEMP/openscience-e2e/data"
            echo "OPENSCIENCE_E2E_PROJECT_DIR=$GITHUB_WORKSPACE"
            echo "OPENSCIENCE_E2E_RUNTIME=$(command -v bun)"
            echo "XDG_DATA_HOME=$RUNNER_TEMP/openscience-e2e/share"
            echo "XDG_CACHE_HOME=$RUNNER_TEMP/openscience-e2e/cache"
            echo "XDG_CONFIG_HOME=$RUNNER_TEMP/openscience-e2e/config"
            echo "XDG_STATE_HOME=$RUNNER_TEMP/openscience-e2e/state"
          } >> "$GITHUB_ENV"
          cat > frontend/workspace/.env.local <<ENV
          VITE_OPENSCIENCE_SERVER_HOST=127.0.0.1
          VITE_OPENSCIENCE_SERVER_PORT=4096
          VITE_OPENSCIENCE_SERVER_USERNAME=openscience
          VITE_OPENSCIENCE_SERVER_PASSWORD=$PASS
          ENV
      - name: Start deterministic E2E model
        run: |
          CONFIG=$(bun frontend/workspace/script/e2e-fake-model.ts --port 4097 --print-config)
          {
            printf '%s\n' "OPENSCIENCE_CONFIG_CONTENT=$CONFIG"
            printf '%s\n' "OPENSCIENCE_E2E_MODEL=e2e/echo"
            printf '%s\n' "OPENSCIENCE_E2E_FAKE_MODEL=1"
            printf '%s\n' "SYNSC_API_BASE=http://127.0.0.1:4097"
          } >> "$GITHUB_ENV"
          bun frontend/workspace/script/e2e-fake-model.ts --port 4097 > "$RUNNER_TEMP/openscience-fake-model.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -fsS "http://127.0.0.1:4097/health" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::deterministic E2E model never became healthy on 127.0.0.1:4097"
          exit 1
      - name: Seed OpenScience data
        working-directory: backend/cli
        run: |
          bun script/seed-e2e.ts
          test -s "$OPENSCIENCE_DATA_DIR/openscience-session.json"
        env:
          OPENSCIENCE_DISABLE_SHARE: "true"
          OPENSCIENCE_DISABLE_LSP_DOWNLOAD: "true"
          OPENSCIENCE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENSCIENCE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          OPENSCIENCE_TEST_HOME: ${{ env.OPENSCIENCE_TEST_HOME }}
          XDG_DATA_HOME: ${{ env.XDG_DATA_HOME }}
          XDG_CACHE_HOME: ${{ env.XDG_CACHE_HOME }}
          XDG_CONFIG_HOME: ${{ env.XDG_CONFIG_HOME }}
          XDG_STATE_HOME: ${{ env.XDG_STATE_HOME }}
          OPENSCIENCE_E2E_PROJECT_DIR: ${{ github.workspace }}
          OPENSCIENCE_E2E_SESSION_TITLE: "E2E Session"
          OPENSCIENCE_E2E_MESSAGE: "Seeded for UI e2e"
          OPENSCIENCE_E2E_MODEL: "e2e/echo"
      - name: Run published OpenScience server
        run: openscience --print-logs --log-level WARN serve --port 4096 > "$RUNNER_TEMP/openscience-server.log" 2>&1 &
        env:
          OPENSCIENCE_DISABLE_SHARE: "true"
          OPENSCIENCE_DISABLE_LSP_DOWNLOAD: "true"
          OPENSCIENCE_DISABLE_DEFAULT_PLUGINS: "true"
          OPENSCIENCE_EXPERIMENTAL_DISABLE_FILEWATCHER: "true"
          OPENSCIENCE_TEST_HOME: ${{ env.OPENSCIENCE_TEST_HOME }}
          XDG_DATA_HOME: ${{ env.XDG_DATA_HOME }}
          XDG_CACHE_HOME: ${{ env.XDG_CACHE_HOME }}
          XDG_CONFIG_HOME: ${{ env.XDG_CONFIG_HOME }}
          XDG_STATE_HOME: ${{ env.XDG_STATE_HOME }}
          OPENSCIENCE_CLIENT: "app"
      - name: Wait for published OpenScience server
        run: |
          HEALTHY=0
          for _ in $(seq 1 120); do
            if curl -fsS "http://127.0.0.1:4096/global/health" > /dev/null; then
              HEALTHY=1
              SESSION=$(curl -fsS -u "openscience:$OPENSCIENCE_SERVER_PASSWORD" \
                "http://127.0.0.1:4096/account/session" || true)
              if [[ "$SESSION" == '{"session":true}' ]]; then
                exit 0
              fi
            fi
            sleep 1
          done
          if [[ "$HEALTHY" == "0" ]]; then
            echo "::error::published OpenScience server never became healthy on 127.0.0.1:4096"
          else
            echo "::error::published OpenScience server became healthy but never loaded the isolated account session"
          fi
          exit 1
      - name: Run packaged E2E
        working-directory: frontend/workspace
        run: bun run test:e2e:packaged
        env:
          CI: true
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:4096"
          PLAYWRIGHT_SERVER_HOST: "127.0.0.1"
          PLAYWRIGHT_SERVER_PORT: "4096"
          VITE_OPENSCIENCE_SERVER_HOST: "127.0.0.1"
          VITE_OPENSCIENCE_SERVER_PORT: "4096"
          OPENSCIENCE_CLIENT: "app"
      - name: Print server logs
        if: failure()
        run: |
          cat "$RUNNER_TEMP/openscience-server.log" || true
          cat "$RUNNER_TEMP/openscience-fake-model.log" || true
      - name: Upload packaged E2E artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-test-packaged-e2e-${{ github.run_attempt }}
          if-no-files-found: ignore
          retention-days: 7
          path: |
            frontend/workspace/e2e/test-results
            frontend/workspace/e2e/playwright-report
            ${{ runner.temp }}/openscience-server.log
            ${{ runner.temp }}/openscience-fake-model.log

  os-smoke:
    needs: publish-test
    if: inputs.run_os_smoke
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            runner: ubuntu-latest
          - name: linux-arm64
            runner: ubuntu-24.04-arm
          - name: macos
            runner: macos-latest
          - name: windows
            runner: windows-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      - name: Install and smoke OpenScience test package
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          prefix="$RUNNER_TEMP/openscience-prefix"
          mkdir -p "$prefix"
          export OPENSCIENCE_DISABLE_SHARE=true
          export OPENSCIENCE_DISABLE_LSP_DOWNLOAD=true
          export OPENSCIENCE_DISABLE_DEFAULT_PLUGINS=true
          export OPENSCIENCE_EXPERIMENTAL_DISABLE_FILEWATCHER=true
          npm install --global --prefix "$prefix" "@synsci/openscience@${{ needs.publish-test.outputs.version }}"
          bin="$prefix/bin/openscience"
          "$bin" --version | tee "$RUNNER_TEMP/openscience-version.txt"
          grep -Fx "${{ needs.publish-test.outputs.version }}" "$RUNNER_TEMP/openscience-version.txt"
          "$bin" serve --port 4096 > "$RUNNER_TEMP/openscience-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 90); do
            curl -fsS "http://127.0.0.1:4096/global/health" > /dev/null && exit 0
            sleep 1
          done
          echo "::error::openscience server never became healthy"
          cat "$RUNNER_TEMP/openscience-smoke.log" || true
          exit 1
      - name: Install and smoke OpenScience test package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $prefix = Join-Path $env:RUNNER_TEMP "openscience-prefix"
          $env:OPENSCIENCE_DISABLE_SHARE = "true"
          $env:OPENSCIENCE_DISABLE_LSP_DOWNLOAD = "true"
          $env:OPENSCIENCE_DISABLE_DEFAULT_PLUGINS = "true"
          $env:OPENSCIENCE_EXPERIMENTAL_DISABLE_FILEWATCHER = "true"
          npm install --global --prefix $prefix "@synsci/openscience@${{ needs.publish-test.outputs.version }}"
          $bin = Join-Path $prefix "openscience.cmd"
          & $bin --version | Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP "openscience-version.txt")
          $actual = Get-Content (Join-Path $env:RUNNER_TEMP "openscience-version.txt")
          if ($actual -ne "${{ needs.publish-test.outputs.version }}") {
            throw "expected version ${{ needs.publish-test.outputs.version }}, got $actual"
          }
          $stdout = Join-Path $env:RUNNER_TEMP "openscience-smoke.out.log"
          $stderr = Join-Path $env:RUNNER_TEMP "openscience-smoke.err.log"
          $proc = Start-Process -FilePath $bin -ArgumentList @("serve", "--port", "4096") -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            foreach ($i in 1..90) {
              try {
                Invoke-WebRequest -UseBasicParsing "http://127.0.0.1:4096/global/health" | Out-Null
                exit 0
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            Get-Content $stdout -ErrorAction SilentlyContinue
            Get-Content $stderr -ErrorAction SilentlyContinue
            throw "openscience server never became healthy"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

  musl-baseline-smoke:
    needs: publish-test
    if: inputs.run_os_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container: node:24-alpine
    steps:
      - name: Install Alpine smoke dependencies
        shell: sh
        run: apk add --no-cache curl libstdc++
      - name: Install and smoke the exact x64 musl baseline
        shell: sh
        run: |
          set -eu
          prefix="$RUNNER_TEMP/openscience-musl-baseline"
          npm install --prefix "$prefix" "@synsci/openscience-linux-x64-baseline-musl@${{ needs.publish-test.outputs.version }}"
          bin="$prefix/node_modules/@synsci/openscience-linux-x64-baseline-musl/bin/openscience"
          "$bin" --version > "$RUNNER_TEMP/openscience-musl-version.txt"
          grep -Fx "${{ needs.publish-test.outputs.version }}" "$RUNNER_TEMP/openscience-musl-version.txt"
          OPENSCIENCE_DISABLE_SHARE=true \
            OPENSCIENCE_DISABLE_LSP_DOWNLOAD=true \
            OPENSCIENCE_DISABLE_DEFAULT_PLUGINS=true \
            OPENSCIENCE_EXPERIMENTAL_DISABLE_FILEWATCHER=true \
            "$bin" serve --port 4096 > "$RUNNER_TEMP/openscience-musl-smoke.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          i=0
          while [ "$i" -lt 90 ]; do
            if curl -fsS "http://127.0.0.1:4096/global/health" > /dev/null; then
              exit 0
            fi
            i=$((i + 1))
            sleep 1
          done
          echo "musl baseline server never became healthy" >&2
          sed -n '1,200p' "$RUNNER_TEMP/openscience-musl-smoke.log" >&2 || true
          exit 1

  promote-test:
    needs:
      - version
      - publish-test
      - packaged-e2e
      - os-smoke
      - musl-baseline-smoke
    if: inputs.run_packaged_e2e && inputs.run_os_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.version.outputs.source }}
      - uses: ./.github/actions/setup-bun
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Restore immutable npm test artifacts
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .release/npm-test/${{ needs.version.outputs.version }}
          key: npm-test-artifacts-v2-${{ needs.version.outputs.source }}-${{ needs.version.outputs.version }}
          fail-on-cache-miss: true
      - name: Promote the verified snapshot to test
        run: ./tooling/repo/npm-test-release.ts promote-test
        env:
          OPENSCIENCE_VERSION: ${{ needs.version.outputs.version }}
          OPENSCIENCE_RELEASE_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_ARTIFACT_SOURCE: ${{ needs.version.outputs.source }}
          OPENSCIENCE_NPM_ARTIFACT_DIR: .release/npm-test/${{ needs.version.outputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
