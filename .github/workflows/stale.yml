name: Stale

on:
  schedule:
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/stale@4391f3da665fdf50b6810c1a66712fb9ba21aa93 # v11.0.0
        with:
          days-before-stale: 90
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          remove-stale-when-updated: true
          exempt-issue-labels: "pinned,security,on-hold,enhancement,good first issue,help wanted"
          exempt-pr-labels: "pinned,security,on-hold"
          stale-issue-message: >
            [automated] This issue has had no activity for 90 days. It will be
            closed in 7 days if there is no new activity. Reopen anytime if you
            still need it.
          close-issue-message: >
            [automated] Closing after 90+ days of inactivity. Feel free to reopen.
          stale-pr-message: >
            [automated] This pull request has had no activity for 90 days. It
            will be closed in 7 days if there is no new activity.
          close-pr-message: >
            [automated] Closing after 90+ days of inactivity. Feel free to reopen.
