name: Feature request
description: Suggest an idea, feature, or enhancement
labels: ["enhancement", "needs-triage"]
body:
  - type: checkboxes
    id: verified
    attributes:
      label: This has not been suggested before
      options:
        - label: I searched open and closed issues for this idea.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the research or engineering task and where OpenScience gets in the way today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What should OpenScience do instead? Sketch the behavior, not the implementation.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Existing skills, connectors, MCP servers, or plugins that almost do this.
    validations:
      required: false
