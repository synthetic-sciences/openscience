[project]
name = "openscience-harbor"
version = "0.1.0"
description = "Run OpenScience as a Harbor / Terminal-Bench installed agent"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["harbor>=0.22"]

[project.optional-dependencies]
test = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openscience_harbor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No .pytest_cache inside the monorepo (prettier would pick up its README).
addopts = "-p no:cacheprovider"
