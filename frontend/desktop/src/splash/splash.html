<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only the scripts and the stylesheet beside this file load here; the
         loader keeps its own styles in its shadow root, which needs the inline
         allowance. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>OpenScience</title>
    <!-- The pre-upgrade rules are the shared UI package's, copied beside this file. -->
    <link rel="stylesheet" href="atom-loader-fallback.css" />
    <style>
      :root {
        color-scheme: dark;
        /* The shared rules reach for the workspace's weak text token; here only
           the two colours in the URL exist to derive it from. */
        --text-weak: color-mix(in srgb, var(--text-strong) 62%, transparent);
      }
      :root[data-color-scheme="light"] {
        color-scheme: light;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background: var(--background-base);
        color: var(--text-strong);
        font:
          500 12px/1 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          Helvetica,
          Arial,
          sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      synsci-loader {
        flex: 0 0 auto;
        font: inherit;
      }
    </style>
  </head>
  <body>
    <synsci-loader
      size="180"
      caption="Starting your local workspace"
      role="img"
      aria-label="Starting your local workspace"
      >Starting your local workspace</synsci-loader
    >
    <script src="splash.js"></script>
    <script type="module" src="synsci-loader.js"></script>
  </body>
</html>
