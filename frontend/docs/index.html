<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>OpenScience Docs</title>
    <meta
      name="description"
      content="Documentation for OpenScience, the open-source AI workbench for scientific research."
    />
    <link rel="canonical" href="https://www.openscience.sh/docs" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
    <meta property="og:type" content="article" />
    <meta property="og:site_name" content="OpenScience" />
    <meta property="og:url" content="https://www.openscience.sh/docs" />
    <meta property="og:title" content="OpenScience Docs" />
    <meta
      property="og:description"
      content="Documentation for OpenScience, the open-source AI workbench for scientific research."
    />
    <meta property="og:image" content="https://www.openscience.sh/og.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@SynScience" />
    <meta name="twitter:title" content="OpenScience Docs" />
    <meta
      name="twitter:description"
      content="Documentation for OpenScience, the open-source AI workbench for scientific research."
    />
    <meta name="twitter:image" content="https://www.openscience.sh/og.jpg" />
    <script>
      // Applies the stored theme before the prerendered page paints.
      try {
        if (localStorage.getItem("docs-theme") === "dark") {
          document.documentElement.classList.add("dark")
          document.documentElement.style.colorScheme = "dark"
        }
      } catch {}
    </script>
    <link rel="icon" href="/synthetic-sciences.svg" type="image/svg+xml" />
    <link rel="preload" href="/fonts/cmc/cmunorm.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
